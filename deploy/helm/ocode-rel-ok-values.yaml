
namespace: release-ok

image:
  repository: nexus.essocode.ru/ess/pvv-rr-m4d-adapter
  tag: "{{.tag}}"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8057
  targetPort: 8057
  portJMX: 9010
  targetPortJMX: 9010

replicaCount: 1

ingress:
  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    cert-manager.io/issue-temporary-certificate: "true"
    acme.cert-manager.io/http01-edit-in-place: "true"
    ingress.kubernetes.io/ssl-redirect: "true"
  tlsEnabled: true  # New parameter to control TLS
  hosts:
    - host: pvv-rr-m4d-adapter.rel.ok.essocode.ru
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: pvv-rr-m4d-adapter-tls
      hosts:
        - pvv-rr-m4d-adapter.rel.ok.essocode.ru

