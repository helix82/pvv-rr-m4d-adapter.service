  minHeapFreeRatio: 10
  maxHeapFreeRatio: 30
  portJMX: 9010
  authenticateJMX: false
  sslJMX: false
  hostnameJMX: localhost
  localOnlyJMX: false

jarFile: pvv-rr-m4d-adapter-0.0.1-SNAPSHOT.jar

env:
  SPRING_DATASOURCE_URL: SPRING_DATASOURCE_URL
  SPRING_DATASOURCE_USERNAME: SPRING_DATASOURCE_USERNAME
