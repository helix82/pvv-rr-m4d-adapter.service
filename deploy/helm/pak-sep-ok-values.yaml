  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
  tlsEnabled: false  # New parameter to control TLS
  hosts:
    - host: pvv-rr-m4d-adapter.pep.cikcp.ru
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: pvv-rr-m4d-adapter-tls
      hosts:
        - pvv-rr-m4d-adapter.pep.cikcp.ru

