jvmOptions:
  xms: 256m
  xmx: 384m
  gc: "-XX:+UseG1GC"
  minHeapFreeRatio: 10
  maxHeapFreeRatio: 30
  portJMX: 9010
  authenticateJMX: false
  sslJMX: false
  hostnameJMX: localhost
  localOnlyJMX: false
  timezone: UTC
  encoding: UTF-8
  logFilePath: /var/log/pep
  logFileName: pvv-rr-m4d-adapter-dev.log

jarFile: pvv-rr-m4d-adapter-0.0.1-SNAPSHOT.jar

env:
  SPRING_DATASOURCE_URL: SPRING_DATASOURCE_URL
  SPRING_DATASOURCE_USERNAME: SPRING_DATASOURCE_USERNAME
  SPRING_DATASOURCE_PASSWORD: SPRING_DATASOURCE_PASSWORD
  SWAGGER_URL: SWAGGER_URL
  AUDIT_URL: AUDIT_URL
  SERVER_PORT: SERVER_PORT
  RESOURCE_ACCESS: RESOURCE_ACCESS
  GET_PVV_CONTENT_URI: GET_PVV_CONTENT_URI
  RR_M4D_BASE_URI: RR_M4D_BASE_URI
  RR_M4D_GET_TOKEN_URI: RR_M4D_GET_TOKEN_URI
  RR_M4D_REGISTRY_M4D_URI: RR_M4D_REGISTRY_M4D_URI
  RR_M4D_REGISTRY_REVOKE_URI: RR_M4D_REGISTRY_REVOKE_URI
  USER_NAME: USER_NAME
  USER_PASSWORD: USER_PASSWORD
  M4D_SOUL: M4D_SOUL
  FNS_SEND_RESPONSE_REGISTRATION_REQUEST_M4D_URI: FNS_SEND_RESPONSE_REGISTRATION_REQUEST_M4D_URI
  FNS_SEND_RESPONSE_STATUS_REQUEST_M4D_URI: FNS_SEND_RESPONSE_STATUS_REQUEST_M4D_URI
  FNS_SEND_RESPONSE_REVOKE_REQUEST_M4D_URI: FNS_SEND_RESPONSE_REVOKE_REQUEST_M4D_URI
  ACTUATOR_ENDPOINTS: ACTUATOR_ENDPOINTS
  APPLICATION_NAME: APPLICATION_NAME

appName: pvv-rr-m4d-adapter

nodeSelector:
  kubernetes.io/hostname: sep-1

terminationGracePeriodSeconds: 30

deployment:
  container:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi

imagePullSecrets:
  - registrypullsecret

resources: {}
