  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
  tlsEnabled: false  # New parameter to control TLS
  hosts:
    - host: pvv-rr-m4d-adapter.pep.ok.dev.cit.st
      paths:
        - path: /
          pathType: ImplementationSpecific
