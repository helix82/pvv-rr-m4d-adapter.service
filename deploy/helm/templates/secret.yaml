apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ .Values.namespace }}
data:
  SPRING_DATASOURCE_URL: {{ .Values.secret.data.SPRING_DATASOURCE_URL }}
  SWAGGER_URL: {{ .Values.secret.data.SWAGGER_URL }}
  SPRING_DATASOURCE_USERNAME: {{ .Values.secret.data.SPRING_DATASOURCE_USERNAME }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.secret.data.SPRING_DATASOURCE_PASSWORD }}
  SERVER_PORT: {{ .Values.secret.data.SERVER_PORT }}
  AUDIT_URL: {{ .Values.secret.data.AUDIT_URL }}
  RESOURCE_ACCESS: {{ .Values.secret.data.RESOURCE_ACCESS }}
  GET_PVV_CONTENT_URI: {{ .Values.secret.data.GET_PVV_CONTENT_URI }}
  GET_TOKEN_URI: {{ .Values.secret.data.GET_TOKEN_URI }}
  REGISTRY_M4D_URI: {{ .Values.secret.data.REGISTRY_M4D_URI }}
  REGISTRY_REVOKE_URI: {{ .Values.secret.data.REGISTRY_REVOKE_URI }}
  USER_NAME: {{ .Values.secret.data.USER_NAME }}
  USER_PASSWORD: {{ .Values.secret.data.USER_PASSWORD }}

