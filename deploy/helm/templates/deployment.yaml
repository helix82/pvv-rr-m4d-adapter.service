apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}-deployment
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.appName }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.appName }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  minReadySeconds: 60
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 30 }}

      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}

      {{- if .Values.hostAliases }}
      hostAliases:
        {{- range .Values.hostAliases }}
        - ip: "{{ .ip }}"
          hostnames:
            {{- range .hostnames }}
            - "{{ . }}"
            {{- end }}
        {{- end }}
      {{- end }}

      containers:
        - name: {{ .Values.appName }}-dev
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          resources:
            requests:
              cpu: {{ .Values.deployment.container.requests.cpu }}
              memory: {{ .Values.deployment.container.requests.memory }}
            limits:
              cpu: {{ .Values.deployment.container.limits.cpu }}
              memory: {{ .Values.deployment.container.limits.memory }}
          command:
            - java
            - "-Xms{{ .Values.jvmOptions.xms }}"
            - "-Xmx{{ .Values.jvmOptions.xmx }}"
            - "{{ .Values.jvmOptions.gc }}"
            - "-Duser.timezone={{ .Values.jvmOptions.timezone }}"
            - "-Dfile.encoding={{ .Values.jvmOptions.encoding }}"
            - "-Dcom.sun.management.jmxremote"
            - "-Dcom.sun.management.jmxremote.port={{ .Values.jvmOptions.portJMX }}"
            - "-Dcom.sun.management.jmxremote.authenticate={{ .Values.jvmOptions.authenticateJMX }}"
            - "-Dcom.sun.management.jmxremote.ssl={{ .Values.jvmOptions.sslJMX }}"
            - "-Djava.rmi.server.hostname={{ .Values.jvmOptions.hostnameJMX }}"
            - "-Dcom.sun.management.jmxremote.local.only={{ .Values.jvmOptions.localOnlyJMX }}"
            - "-DLOGGING_FILE_PATH={{ .Values.jvmOptions.logFilePath }}"
            - "-DLOGGING_FILE_NAME={{ .Values.jvmOptions.logFileName }}"
            - "-XX:MinHeapFreeRatio={{ .Values.jvmOptions.minHeapFreeRatio }}"
            - "-XX:MaxHeapFreeRatio={{ .Values.jvmOptions.maxHeapFreeRatio }}"
            - -jar
            - "{{ .Values.jarFile }}"
          volumeMounts:
            - name: pvv-rr-m4d-adapter-logs
              mountPath: {{ .Values.jvmOptions.logFilePath }}
          ports:
            - containerPort: {{ .Values.service.port }}
            - containerPort: {{ .Values.service.portJMX }}
          env:
            - name: SWAGGER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.SWAGGER_URL }}
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.SPRING_DATASOURCE_URL }}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.SPRING_DATASOURCE_USERNAME }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.SPRING_DATASOURCE_PASSWORD }}
            - name: SERVER_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.SERVER_PORT }}
            - name: AUDIT_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.AUDIT_URL }}
            - name: RESOURCE_ACCESS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.RESOURCE_ACCESS }}
            - name: GET_PVV_CONTENT_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.GET_PVV_CONTENT_URI }}
            - name: RR_M4D_BASE_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.RR_M4D_BASE_URI }}
            - name: RR_M4D_GET_TOKEN_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.RR_M4D_GET_TOKEN_URI }}
            - name: RR_M4D_REGISTRY_M4D_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.RR_M4D_REGISTRY_M4D_URI }}
            - name: RR_M4D_REGISTRY_REVOKE_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.RR_M4D_REGISTRY_REVOKE_URI }}
            - name: USER_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.USER_NAME }}
            - name: USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.USER_PASSWORD }}
            - name: M4D_SOUL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.M4D_SOUL }}
            - name: FNS_SEND_RESPONSE_REGISTRATION_REQUEST_M4D_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.FNS_SEND_RESPONSE_REGISTRATION_REQUEST_M4D_URI }}
            - name: FNS_SEND_RESPONSE_STATUS_REQUEST_M4D_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.FNS_SEND_RESPONSE_STATUS_REQUEST_M4D_URI }}
            - name: FNS_SEND_RESPONSE_REVOKE_REQUEST_M4D_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.FNS_SEND_RESPONSE_REVOKE_REQUEST_M4D_URI }}
            - name: ACTUATOR_ENDPOINTS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.ACTUATOR_ENDPOINTS }}
            - name: APPLICATION_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.env.APPLICATION_NAME }}
      volumes:
        - name: pvv-rr-m4d-adapter-logs
          hostPath:
            path: {{ .Values.jvmOptions.logFilePath }}
            type: DirectoryOrCreate
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
