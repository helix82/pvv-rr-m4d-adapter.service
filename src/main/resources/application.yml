server:
  port: ${SERVER_PORT:8057}

logging:
  level:
    su.opencode.digsigcik.pvv-rr-m4d-adapter: DEBUG
    org.springframework.web: DEBUG
    org.apache.http: DEBUG

spring:
  #  hotfix for running swagger in spring boot 2
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
rr-m4d:
  get-token:
    uri: ${GET_TOKEN_URI:https://operator.cprr-it.weintegrator.com/api/v0/vst-oauth2/oauth/token}
  registry-m4d:
    uri: ${REGISTRY_M4D_URI:https://operator.cprr-it.weintegrator.com/api/v0/poar-webapp/integration/poa}
  registry-revoke:
    uri: ${REGISTRY_REVOKE_URI:https://operator.cprr-it.weintegrator.com/api/v0/poar-webapp/integration/poa/revoke}
  user-id: some_user_id
  user-name: ${USER_NAME:demo-client}
  user-password: ${USER_PASSWORD:secret}
  soul: ${M4D_SOUL:"}

pvv:
  get-message-content: ${GET_PVV_CONTENT_URI:http://localhost:8078/api/v1/inbox/}

#Swagger
springdoc:
  api-docs:
    # It should be off for PROD
    enabled: true
  server:
    url: ${SWAGGER_URL:http://localhost:8057}
