server:
  port: ${SERVER_PORT:8057}

logging:
  file:
    name: ${LOGGING_FILE_NAME:pvv-rr-m4d-adapter.log}
    path: ${LOGGING_FILE_PATH:log/pvv-rr-m4d-adapter}
  level:
    su.opencode.digsigcik.pvv_rr_m4d_adapter: DEBUG
    org.springframework.web: DEBUG
    org.apache.http: DEBUG

spring:
  application:
    name: ${APPLICATION_NAME:pvv-rr-m4d-adapter}
  #  hotfix for running swagger in spring boot 2
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
rr-m4d:
  base-uri: ${RR_M4D_BASE_URI:https://operator.cprr-it.cprr.cloud}
  get-token:
    uri: ${RR_M4D_GET_TOKEN_URI:/api/v0/vst-oauth2/oauth/token}
  registry-m4d:
    uri: ${RR_M4D_REGISTRY_M4D_URI:/api/v0/poar-webapp/integration/poa}
  registry-revoke:
    uri: ${RR_M4D_REGISTRY_REVOKE_URI:/api/v0/poar-webapp/integration/poa/revoke}
  user-id: some_user_id
  user-name: ${USER_NAME:demo-client}
  user-password: ${USER_PASSWORD:secret}
  soul: ${M4D_SOUL:"}

pvv:
  get-message-content: ${GET_PVV_CONTENT_URI:http://localhost:8078/api/v1/inbox/}
  fns-send-response-registration-request-m4d: ${FNS_SEND_RESPONSE_REGISTRATION_REQUEST_M4D_URI:https://pvv-adapter.rel.ok.essocode.ru/api/v1/manual/rrm4d/send-registration-request-json}
  fns-send-response-status-request-m4d: ${FNS_SEND_RESPONSE_STATUS_REQUEST_M4D_URI:https://pvv-adapter.rel.ok.essocode.ru/api/v1/manual/rrm4d/send-status-request-file}
  fns-send-response-revoke-request-m4d: ${FNS_SEND_RESPONSE_REVOKE_REQUEST_M4D_URI:https://pvv-adapter.rel.ok.essocode.ru/api/v1/manual/rrm4d/send-revocation-request-json}
#Swagger
springdoc:
  swagger-ui:
    url: /v3/api-docs
  api-docs:
    # It should be off for PROD
    enabled: true
  server:
    url: ${SWAGGER_URL:http://localhost:8057}
  show-actuator: true

#actuator
management:
  endpoint:
    health:
      group:
        readiness:
          include: db, readinessState
      probes:
        enabled: true
      show-details: always
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_ENDPOINTS:*}